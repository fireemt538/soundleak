name: build-ipa
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          set -eo pipefail
          app=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$app/Contents/Developer"
          xcodebuild -version
          brew install xcodegen --quiet
          B=https://raw.githubusercontent.com/forcequitOS/worse_query/main/worse_query
          curl -fsSL "$B/worse_query.h" -o SoundLeak/worse_query.h
          curl -fsSL "$B/worse_query.m" -o SoundLeak/worse_query.m
          curl -fsSL "$B/pathleak.m" -o SoundLeak/pathleak.m
          printf '%s\n' '#ifndef pathleak_h' '#define pathleak_h' '#import <Foundation/Foundation.h>' '#include <stdint.h>' 'NSArray<NSString *> *pathleak(NSString *path, uint64_t max_inode);' '#endif' > SoundLeak/pathleak.h
          printf '%s\n' '#import <Foundation/Foundation.h>' 'NSArray<NSString *> *WQAppGroups(void);' > SoundLeak/entitlements.h
          printf '%s\n' '#import <Foundation/Foundation.h>' '#import <Security/Security.h>' 'NSArray<NSString *> *WQAppGroups(void) {' '    extern void *SecTaskCreateFromSelf(CFAllocatorRef);' '    extern CFTypeRef SecTaskCopyValueForEntitlement(void *, CFStringRef, CFErrorRef *);' '    void *task = SecTaskCreateFromSelf(NULL);' '    if (!task) return @[];' '    CFTypeRef v = SecTaskCopyValueForEntitlement(task, CFSTR("com.apple.security.application-groups"), NULL);' '    if (!v) return @[];' '    NSArray *a = (__bridge_transfer NSArray *)v;' '    return [a isKindOfClass:[NSArray class]] ? a : @[];' '}' > SoundLeak/entitlements.m
          printf '#import "worse_query.h"\n#import "pathleak.h"\n#import "entitlements.h"\n' > SoundLeak/Bridging.h
          wc -l SoundLeak/SoundLeakApp.swift
          grep -q 'struct AppDetailView' SoundLeak/SoundLeakApp.swift || { echo "::error::swift file truncated"; exit 1; }
          xcodegen generate
          xcodebuild -project SoundLeak.xcodeproj -scheme SoundLeak -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | tail -n 100
          APP=build/Build/Products/Release-iphoneos/SoundLeak.app
          codesign --force --sign - --entitlements SoundLeak/SoundLeak.entitlements "$APP"
          rm -rf Payload SoundLeak.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry SoundLeak.ipa Payload
      - name: Errors
        if: failure()
        run: |
          grep -nE "error:" build.log | head -40 || true
          tail -n 50 build.log || true
      - uses: actions/upload-artifact@v5
        with:
          name: SoundLeak-ipa
          path: SoundLeak.ipa
