name: build-ipa

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          for app in /Applications/Xcode_26*.app /Applications/Xcode.app; do
            [ -d "$app" ] || continue
            v=$("$app/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | head -1 | awk '{print $NF}')
            [ "${v%%.*}" -ge 26 ] 2>/dev/null || continue
            sudo xcode-select -s "$app/Contents/Developer"
            xcodebuild -version
            exit 0
          done
          echo "No Xcode 26 found"; ls /Applications; exit 1

      - name: Fetch worse_query sources
        run: |
          set -euo pipefail
          B=https://raw.githubusercontent.com/forcequitOS/worse_query/main/worse_query
          curl -fsSL "$B/worse_query.h" -o SoundLeak/worse_query.h
          curl -fsSL "$B/worse_query.m" -o SoundLeak/worse_query.m
          curl -fsSL "$B/pathleak.m"    -o SoundLeak/pathleak.m
          cat > SoundLeak/pathleak.h <<'EOF'
          #ifndef pathleak_h
          #define pathleak_h
          #import <Foundation/Foundation.h>
          #include <stdint.h>
          NSArray<NSString *> *pathleak(NSString *path, uint64_t max_inode);
          #endif
          EOF
          printf '#import "worse_query.h"\n#import "pathleak.h"\n' > SoundLeak/Bridging.h

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild -project SoundLeak.xcodeproj -scheme SoundLeak \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build

      - name: Verify binary
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release-iphoneos/SoundLeak.app
          nm -gU "$APP/SoundLeak" | grep -q _worse_query
          nm -gU "$APP/SoundLeak" | grep -q _pathleak
          plutil -p "$APP/Info.plist" | grep -q '"MinimumOSVersion" => "26.0"'
          echo "symbols and plist OK"

      - name: Sign with entitlements
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release-iphoneos/SoundLeak.app
          codesign --force --sign - --entitlements SoundLeak/SoundLeak.entitlements "$APP"
          codesign -d --entitlements :- "$APP" 2>/dev/null | plutil -p - | grep -q application-groups
          echo "entitlements OK"

      - name: Package
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release-iphoneos/SoundLeak.app
          rm -rf Payload SoundLeak.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry SoundLeak.ipa Payload
          ls -l SoundLeak.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SoundLeak-ipa
          path: SoundLeak.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="build-$(date +%Y%m%d-%H%M%S)"
          gh release create "$tag" SoundLeak.ipa \
            --title "SoundLeak $tag" \
            --notes "Unsigned ad-hoc build. Re-sign with AltStore or SideStore before installing."
