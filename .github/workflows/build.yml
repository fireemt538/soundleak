name: build-ipa

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Diagnose image
        run: |
          sw_vers
          uname -m
          echo "== /Applications =="
          ls /Applications

      - name: Select Xcode
        run: |
          set -o pipefail
          best=""
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            v=$("$app/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | head -1 | awk '{print $2}' || true)
            echo "$app -> ${v:-unknown}"
            major="${v%%.*}"
            case "$major" in ''|*[!0-9]*) continue ;; esac
            if [ "$major" -ge 26 ]; then best="$app"; fi
          done
          if [ -z "$best" ]; then
            echo "::error::No Xcode 26 on this image"
            exit 1
          fi
          sudo xcode-select -s "$best/Contents/Developer"
          sudo xcodebuild -license accept || true
          xcodebuild -version

      - name: Install xcodegen
        run: |
          set -eo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen --quiet || {
              curl -fsSL -o /tmp/xcodegen.zip \
                https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
              unzip -q /tmp/xcodegen.zip -d /tmp/xg
              sudo cp /tmp/xg/xcodegen/bin/xcodegen /usr/local/bin/
              sudo cp -R /tmp/xg/xcodegen/share/. /usr/local/share/ 2>/dev/null || true
            }
          fi
          xcodegen --version

      - name: Fetch worse_query sources
        run: |
          set -eo pipefail
          B=https://raw.githubusercontent.com/forcequitOS/worse_query/main/worse_query
          curl -fsSL "$B/worse_query.h" -o SoundLeak/worse_query.h
          curl -fsSL "$B/worse_query.m" -o SoundLeak/worse_query.m
          curl -fsSL "$B/pathleak.m"    -o SoundLeak/pathleak.m
          printf '%s\n' '#ifndef pathleak_h' '#define pathleak_h' \
            '#import <Foundation/Foundation.h>' '#include <stdint.h>' \
            'NSArray<NSString *> *pathleak(NSString *path, uint64_t max_inode);' '#endif' \
            > SoundLeak/pathleak.h
          printf '#import "worse_query.h"\n#import "pathleak.h"\n' > SoundLeak/Bridging.h
          ls -l SoundLeak

      - name: Generate project
        run: |
          set -eo pipefail
          xcodegen generate
          ls -d SoundLeak.xcodeproj

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project SoundLeak.xcodeproj -scheme SoundLeak \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | tail -n 120

      - name: Show errors
        if: failure()
        run: |
          [ -f build.log ] && grep -nE "error:|does not contain a scheme" build.log | head -n 60
          echo "---"
          [ -f build.log ] && tail -n 60 build.log
          true

      - name: Verify binary
        run: |
          set -eo pipefail
          APP=build/Build/Products/Release-iphoneos/SoundLeak.app
          ls -l "$APP"
          nm -gU "$APP/SoundLeak" | grep -q _worse_query
          nm -gU "$APP/SoundLeak" | grep -q _pathleak
          plutil -p "$APP/Info.plist" | grep -q '26.0'
          echo "symbols OK"

      - name: Sign with entitlements
        run: |
          set -eo pipefail
          APP=build/Build/Products/Release-iphoneos/SoundLeak.app
          codesign --force --sign - --entitlements SoundLeak/SoundLeak.entitlements "$APP"
          codesign -d --entitlements :- "$APP" 2>/dev/null | plutil -p - | grep -q application-groups
          echo "entitlements OK"

      - name: Package
        run: |
          set -eo pipefail
          APP=build/Build/Products/Release-iphoneos/SoundLeak.app
          rm -rf Payload SoundLeak.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry SoundLeak.ipa Payload
          ls -l SoundLeak.ipa

      - uses: actions/upload-artifact@v5
        with:
          name: SoundLeak-ipa
          path: SoundLeak.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          tag="build-$(date +%Y%m%d-%H%M%S)"
          gh release create "$tag" SoundLeak.ipa \
            --title "SoundLeak $tag" \
            --notes "Unsigned ad-hoc build. Re-sign with AltStore or SideStore before installing."
