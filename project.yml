name: SoundLeak
options:
  bundleIdPrefix: cc.soundleak
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
targets:
  SoundLeak:
    type: application
    platform: iOS
    sources: [SoundLeak]
    scheme:
      testTargets: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.soundleak.app
        INFOPLIST_FILE: SoundLeak/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: SoundLeak/SoundLeak.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: SoundLeak/Bridging.h
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
